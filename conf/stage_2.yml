# Data Configuration
img_dir: "data/dataset-stage-2/imgs"
abc_dir: "data/dataset-stage-2/abcs-strip"
input_size: 640
num_workers: 4

# Data Mixture Configuration
# mix_ratio: [main_ratio, mix1_ratio, ...] — first element anchors epoch length
use_mix: true
mix_ratio:
  - 2
  - 1
mix_img_dir:
  - "data/dataset-stage-1/imgs"
mix_ann_dir:
  - "data/dataset-stage-1/abcs-strip"

# Model Configuration
vision_model_name: "convnext_base.dinov3_lvd1689m"
text_model_name: "checkpoints/pretrain/gemma-3-gelato-resized"
text_dim: 1024
vision_feature_dims: 
  - 128
  - 256
  - 512
engram_warm_start: null

# Low Memory Configuration
visual_pool_size: 12
max_seq_len: 768
grad_accum_steps: 8
mask_ratio: 0.5

# Training Configuration
phase: "finetune"
fine_tune: "checkpoints/run_001"
output_dir: "checkpoints"
logging_dir: "runs"
epochs: 10
batch_size: 4
lr_projector: 0.00005
lr_text: 0.00002
logging_steps: 50
save_steps: 500
max_steps: -1
seed: 42
resume: false
resume_from_checkpoint: null
